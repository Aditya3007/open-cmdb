services:
  postgres:
    image: postgres:16-alpine
    container_name: open-cmdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
  
  redis:
    image: redis:7-alpine
    container_name: open-cmdb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

networks:
  default:
    name: open-cmdb-network